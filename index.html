<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCP Personal Notebook — Physical Edition V6</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Dancing+Script:wght@400;500;600;700&family=Indie+Flower&family=Patrick+Hand&family=Shadows+Into+Light&family=Special+Elite&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden
}

body{
    font-family:Inter,Arial,sans-serif;
    background:#17191a;
    color:#d6d6d2
}

/* =========================================================
   TERMINAL BACKGROUND
   ========================================================= */

body:before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-10;
    pointer-events:none;
    opacity:.34;
    background-image:
        radial-gradient(
            circle,
            rgba(210,216,214,.20) .65px,
            transparent .8px
        ),
        linear-gradient(
            90deg,
            transparent 0 49.95%,
            rgba(170,180,180,.035) 50%,
            transparent 50.05%
        );
    background-size:6px 6px,100% 100%;
}

body:after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-9;
    pointer-events:none;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.012) 0,
            rgba(255,255,255,.012) 1px,
            transparent 1px,
            transparent 4px
        ),
        radial-gradient(
            ellipse at center,
            transparent 42%,
            rgba(0,0,0,.35) 100%
        );
}

#deskLight,
.deskFiber{
    position:fixed;
    inset:0;
    z-index:-7;
    pointer-events:none;
    opacity:.12;
    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 38px,
            rgba(255,255,255,.025) 39px,
            transparent 40px
        );
}

/* =========================================================
   GENERAL UI
   ========================================================= */

button,select,input{
    font:600 10px Inter
}

button{
    border:1px solid #4b4b4b;
    background:linear-gradient(#393939,#1c1c1c);
    color:#ddd;
    border-radius:5px;
    padding:8px 10px;
    cursor:pointer;
    letter-spacing:.55px;
    white-space:nowrap
}

button:hover{
    background:#4a4a4a;
    transform:translateY(-1px)
}

button.active{
    background:#ece8df;
    color:#171717;
    border-color:#aaa
}

button.danger{
    color:#ffb1aa
}

.sep{
    width:1px;
    height:26px;
    background:#444;
    margin:0 2px
}

/* =========================================================
   TOP BAR
   ========================================================= */

#topbar{
    position:fixed;
    top:14px;
    left:50%;
    transform:translateX(-50%);
    width:min(1120px,calc(100vw - 28px));
    min-height:54px;
    z-index:50000;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;

    padding:8px 10px 8px 14px;

    background:
        linear-gradient(
            180deg,
            rgba(38,40,40,.96),
            rgba(25,27,27,.96)
        );

    border:1px solid #4a4d4c;
    border-radius:5px;

    box-shadow:
        0 12px 30px rgba(0,0,0,.42),
        inset 0 1px rgba(255,255,255,.055);

    backdrop-filter:blur(8px);
}

.brandBlock{
    min-width:225px;
    line-height:1
}

.brandMain{
    font-family:Oswald,Inter,sans-serif;
    font-size:14px;
    letter-spacing:2.4px;
    color:#e1e1de
}

.brandSub{
    margin-top:5px;
    font:8px Inter,sans-serif;
    letter-spacing:1.3px;
    color:#777c7c
}

.topActions{
    display:flex;
    align-items:center;
    gap:5px
}

.topActions button{
    min-height:31px;
    padding:6px 9px;
    border:1px solid #505453;
    border-radius:4px;
    background:#292c2c;
    color:#cfd1cf;
    font:600 9px Inter,sans-serif;
    letter-spacing:.8px;
    transition:
        background .15s ease,
        border-color .15s ease,
        transform .15s ease
}

.topActions button:hover{
    background:#353939;
    border-color:#686d6c;
    transform:translateY(-1px)
}

.topActions button:first-child,
.topActions button:nth-child(3){
    width:31px;
    padding:0;
    font-size:20px
}

.topActions #pageLabel{
    min-width:68px;
    text-align:center;
    color:#969b9a;
    font:8px Special Elite,monospace;
    letter-spacing:1.5px
}

.uiSep{
    width:1px;
    height:23px;
    margin:0 3px;
    background:#4a4d4c
}

/* =========================================================
   FORMAT BAR
   ========================================================= */

#formatbar{
    position:fixed;
    top:78px;
    left:50%;
    transform:translateX(-50%);
    z-index:49999;

    display:flex;
    align-items:center;
    gap:4px;

    padding:5px;

    background:rgba(28,30,30,.94);
    border:1px solid #454847;
    border-radius:5px;

    box-shadow:0 9px 24px rgba(0,0,0,.34);
    backdrop-filter:blur(8px)
}

#formatbar select,
#formatbar input{
    height:28px;
    border:1px solid #484c4b;
    border-radius:3px;
    background:#242727;
    color:#cfd2d0;
    font:9px Inter,sans-serif
}

#formatbar select{
    min-width:90px;
    padding:0 6px
}

#formatbar input{
    width:30px;
    padding:2px
}

#formatbar button{
    height:28px;
    min-width:29px;
    padding:4px 7px;
    border:1px solid #484c4b;
    border-radius:3px;
    background:#252828;
    color:#cfd2d0;
    font:9px Inter,sans-serif;
    cursor:pointer
}

#formatbar button:hover{
    background:#373b3a
}

.colorpick{
    width:30px!important;
    padding:2px!important
}

/* =========================================================
   TOOLBOX
   ========================================================= */

#assets{
    position:fixed;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    z-index:50000;

    width:186px;
    max-height:76vh;
    overflow-y:auto;

    padding:10px;

    background:rgba(27,29,29,.95);
    border:1px solid #454847;
    border-radius:5px;

    box-shadow:0 15px 38px rgba(0,0,0,.45);
    backdrop-filter:blur(8px)
}

#assets h3{
    margin:3px 3px 9px;
    color:#d0d2d0;
    font:10px Special Elite,monospace;
    letter-spacing:2px
}

.toolGroup{
    padding:7px 0 8px;
    border-top:1px solid rgba(255,255,255,.055)
}

.toolGroup:first-of-type{
    border-top:0
}

.toolGroupTitle{
    margin:1px 4px 5px;
    color:#737978;
    font:700 8px Inter,sans-serif;
    letter-spacing:1.5px
}

.tool{
    width:100%;
    margin:2px 0;
    padding:7px 8px;
    border:1px solid #414544;
    border-radius:3px;
    background:#242727;
    color:#bfc2c0;
    text-align:left;
    font:9px Inter,sans-serif;
    letter-spacing:.35px;
    cursor:pointer;
    transition:
        background .15s ease,
        border-color .15s ease,
        padding-left .15s ease
}

.tool:hover{
    background:#303433;
    border-color:#5b605f;
    padding-left:10px
}

/* =========================================================
   BOOK / SCENE
   ========================================================= */

#scene{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    perspective:2800px
}

#bookShadow{
    position:absolute;
    width:min(66vw,820px);
    height:min(90vh,1080px);
    border-radius:15px;
    background:#000;
    filter:blur(30px);
    opacity:.72;
    transform:translate(27px,35px) rotate(-.35deg)
}

#bookShadow:after{
    content:"";
    position:absolute;
    inset:-90px;
    background:radial-gradient(
        ellipse at 72% 30%,
        #ffe5ad22,
        transparent 36%
    );
    filter:blur(25px)
}

#book{
    position:relative;
    width:min(59vw,720px);
    height:min(88vh,1000px);
    min-width:500px;
    min-height:690px;
    transform:rotate(-.25deg);
    transform-style:preserve-3d
}

#cover{
    position:absolute;
    inset:-19px -22px -19px -25px;
    border-radius:13px;
    background:
        radial-gradient(circle at 22% 17%,#fff2 0 2%,transparent 18%),
        repeating-radial-gradient(
            ellipse at 30% 40%,
            #fff2 0 1px,
            transparent 1px 5px
        ),
        linear-gradient(
            135deg,
            #2c2c2c,
            #0b0b0b 48%,
            #202020 75%,
            #080808
        );
    box-shadow:
        inset 0 0 0 1px #fff2,
        inset 8px 0 13px #fff1,
        inset -10px 0 20px #0009;
    z-index:0
}

#cover:after{
    content:"";
    position:absolute;
    inset:7px;
    border:1px solid #fff1;
    border-radius:9px
}

#stack{
    position:absolute;
    inset:0;
    z-index:1
}

.stackSheet{
    position:absolute;
    inset:5px -8px -7px 5px;
    border-radius:5px;
    background:repeating-linear-gradient(
        0deg,
        #d3cdbf 0 2px,
        #c7c1b4 3px
    );
    box-shadow:3px 5px 4px #0005
}

.stackSheet:nth-child(2){
    inset:8px -12px -10px 8px;
    opacity:.8
}

.stackSheet:nth-child(3){
    inset:11px -15px -13px 11px;
    opacity:.55
}

#pages{
    position:absolute;
    inset:0;
    z-index:10;
    transform-style:preserve-3d;
    isolation:isolate;
    overflow:visible
}

.page-sheet{
    position:absolute;
    inset:0;
    transform-origin:left center;
    transform-style:preserve-3d;
    transition:
        transform .92s cubic-bezier(.58,.08,.22,1),
        box-shadow .92s ease;
    will-change:transform;
    pointer-events:none;
    backface-visibility:visible;
    contain:paint;
    overflow:visible
}

.page-sheet.flipped{
    transform:rotateY(-180deg);
    box-shadow:-28px 0 44px #0004
}

.page-sheet.turning{
    box-shadow:20px 0 45px #0008
}

.page-sheet.behind{
    z-index:1!important
}

.page-sheet.frontmost{
    z-index:9000!important
}

.page-sheet.under-turn{
    z-index:8000!important
}

.page-sheet.turning{
    pointer-events:none!important
}

.page-sheet.active{
    pointer-events:auto
}

.page-sheet.turning:after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.18),
            transparent 12%,
            transparent 68%,
            rgba(0,0,0,.20)
        );
    opacity:.8;
    transform:translateZ(1px);
    z-index:20
}

.page-sheet.flipped:after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.14),
            transparent 16%,
            rgba(0,0,0,.06)
        );
    opacity:.55
}

/* =========================================================
   PAGE
   ========================================================= */

.face{
    position:absolute;
    inset:0;
    overflow:hidden;
    backface-visibility:hidden;
    transform-style:preserve-3d;
    border-radius:4px;

    background:
        radial-gradient(
            ellipse at 20% 15%,
            #fff9,
            transparent 42%
        ),
        repeating-linear-gradient(
            0deg,
            #654f3210 0 1px,
            transparent 1px 4px
        ),
        repeating-linear-gradient(
            92deg,
            transparent 0 3px,
            #654f3208 4px,
            transparent 5px
        ),
        linear-gradient(
            90deg,
            #eee8d8,
            #f6f1e5 48%,
            #e9e2d3
        );

    border:1px solid #654f3220;

    box-shadow:
        inset 0 0 35px #5b432018,
        0 4px 7px #0002
}

.face:before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(
            circle at 10% 90%,
            #70451c09,
            transparent 16%
        ),
        radial-gradient(
            circle at 90% 10%,
            #70451c07,
            transparent 15%
        );
    mix-blend-mode:multiply
}

.face:after{
    content:"";
    position:absolute;
    right:0;
    top:0;
    bottom:0;
    width:27px;
    background:linear-gradient(
        90deg,
        transparent,
        #4c382018
    );
    pointer-events:none
}

.back{
    transform:rotateY(180deg);
    background:linear-gradient(
        90deg,
        #ded7c7,
        #eee7d8 50%,
        #ddd6c6
    )
}

.back .backmark{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#0002;
    font:11px Special Elite;
    letter-spacing:4px;
    transform:rotate(180deg)
}

.content{
    position:absolute;
    inset:26px 25px 25px 42px;
    overflow:auto;
    z-index:2;
    scrollbar-width:thin;
    scrollbar-color:#8f8b84 transparent
}

.content::-webkit-scrollbar{
    width:6px
}

.content::-webkit-scrollbar-thumb{
    background:#999;
    border-radius:20px
}

/* =========================================================
   COVER
   ========================================================= */

.logo{
    width:140px;
    height:140px;
    object-fit:contain;
    filter:
        grayscale(1)
        contrast(1.15)
        drop-shadow(0 3px 2px #0003)
}

.title{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center
}

.ft{
    font:31px Special Elite;
    letter-spacing:4px;
    color:#171717 !important;
    -webkit-text-fill-color:#171717 !important
}

.sub{
    font:10px Inter;
    letter-spacing:4px;
    color:#555;
    margin:5px 0 42px
}

.meta{
    width:80%;
    display:grid;
    gap:16px
}

.row{
    display:grid;
    grid-template-columns:135px 1fr;
    border-bottom:1px solid #0003;
    padding-bottom:5px
}

.label{
    font:11px Special Elite;
    letter-spacing:2px;
    color:#171717 !important;
    -webkit-text-fill-color:#171717 !important
}

.value{
    font:25px Caveat;
    color:#171717 !important;
    -webkit-text-fill-color:#171717 !important;
    min-height:27px;
    outline:none;
    caret-color:#171717
}

/* =========================================================
   NOTE / WRITING
   ========================================================= */

.note{
    height:100%;
    display:flex;
    flex-direction:column
}

.head{
    display:grid;
    grid-template-columns:1fr 150px;
    gap:15px;
    border-bottom:1px solid #0003;
    padding-bottom:7px;
    margin-bottom:10px
}

.ntitle{
    font:32px Caveat;
    font-weight:600;
    color:#171717 !important;
    -webkit-text-fill-color:#171717 !important;
    outline:none;
    caret-color:#171717
}

.date{
    font:21px Caveat;
    color:#171717 !important;
    -webkit-text-fill-color:#171717 !important;
    text-align:right;
    outline:none;
    caret-color:#171717
}

.writing{
    font:27px/1.38 Caveat;
    color:#171717 !important;
    -webkit-text-fill-color:#171717 !important;
    outline:none;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    min-height:calc(100% - 65px);
    padding-bottom:90px;
    caret-color:#171717
}

.writing:empty:before{
    content:"Begin writing...";
    color:#0003;
    -webkit-text-fill-color:#0003
}

.page-lines .writing{
    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0 36px,
            #35527b16 37px,
            #35527b16 38px
        );
    background-position:0 4px
}

.margin-line{
    position:absolute;
    left:34px;
    top:0;
    bottom:0;
    width:1px;
    background:#a63e3e25;
    pointer-events:none
}

.pno{
    position:absolute;
    bottom:8px;
    right:25px;
    color:#0005;
    font:9px Special Elite;
    z-index:5
}

.curl{
    position:absolute;
    right:0;
    bottom:0;
    width:105px;
    height:105px;
    background:
        linear-gradient(
            135deg,
            transparent 49%,
            #0001 50%,
            #fff9 62%,
            transparent 63%
        );
    pointer-events:none
}

/* =========================================================
   OBJECTS
   ========================================================= */

.obj{
    position:absolute;
    z-index:40;
    user-select:none;
    touch-action:none;
    transform-origin:center;
    cursor:grab
}

.obj.selected{
    outline:1px dashed rgba(40,40,40,.55)
}

.obj img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    pointer-events:none
}

.handle{
    display:none;
    position:absolute;
    width:10px;
    height:10px;
    background:#eee9dc;
    border:1px solid #222;
    box-shadow:0 1px 2px rgba(0,0,0,.3);
    z-index:20
}

.selected .handle{
    display:block
}

.tl{
    left:-6px;
    top:-6px;
    cursor:nwse-resize
}

.tr{
    right:-6px;
    top:-6px;
    cursor:nesw-resize
}

.bl{
    left:-6px;
    bottom:-6px;
    cursor:nesw-resize
}

.br{
    right:-6px;
    bottom:-6px;
    cursor:nwse-resize
}

.rotline{
    display:none;
    position:absolute;
    left:50%;
    top:-25px;
    width:1px;
    height:20px;
    background:#111
}

.selected .rotline{
    display:block
}

.rot{
    display:none;
    position:absolute;
    left:50%;
    top:-39px;
    transform:translateX(-50%);
    width:14px;
    height:14px;
    border-radius:50%;
    background:#f5f0e4;
    border:1px solid #111;
    cursor:grab
}

.selected .rot{
    display:block
}

/* =========================================================
   TEXT BOX
   ========================================================= */

.textbox{
    min-width:150px;
    min-height:48px;
    padding:5px 8px;
    font:28px/1.15 Caveat;
    color:#171717 !important;
    -webkit-text-fill-color:#171717 !important;
    outline:none;
    background:transparent;
    white-space:pre-wrap;
    caret-color:#171717
}

.selected .textbox{
    outline:1px dashed #2226
}

/* =========================================================
   MARKUP
   ========================================================= */

.highlightBlock{
    padding:0 3px;
    background:
        linear-gradient(
            176deg,
            transparent 13%,
            var(--hl,#f0d95b99) 15% 32%,
            transparent 34%,
            var(--hl,#f0d95b99) 36% 72%,
            transparent 76%
        );
    font:28px Caveat;
    transform:rotate(-.25deg);
    display:inline-block
}

.rough-highlight{
    position:relative;
    padding:0 2px;
    background:
        linear-gradient(
            176deg,
            transparent 7%,
            var(--mark,#f4dc4eb8) 10%,
            var(--mark,#f4dc4eb8) 28%,
            transparent 31%,
            var(--mark,#f4dc4eb8) 34%,
            var(--mark,#f4dc4eb8) 70%,
            transparent 76%
        );
    box-decoration-break:clone;
    -webkit-box-decoration-break:clone
}

.rough-underline{
    position:relative;
    text-decoration:none
}

.rough-underline:after{
    content:"";
    position:absolute;
    left:-1%;
    right:-2%;
    bottom:-2px;
    height:5px;
    background:#1e1b18d9;
    clip-path:polygon(
        0 42%,12% 25%,25% 48%,39% 19%,52% 43%,
        65% 27%,79% 50%,91% 29%,100% 42%,100% 68%,
        90% 58%,79% 76%,66% 54%,52% 73%,39% 49%,
        25% 72%,12% 53%,0 66%
    );
    transform:rotate(-.8deg);
    border-radius:4px
}

.rough-cross{
    position:relative;
    text-decoration:none
}

.rough-cross:after{
    content:"";
    position:absolute;
    left:-4%;
    right:-5%;
    top:8%;
    height:88%;
    pointer-events:none;
    background:
        linear-gradient(
            1deg,
            transparent 0 13%,
            rgba(12,12,11,.88) 14% 19%,
            transparent 20% 29%,
            rgba(15,14,13,.80) 30% 35%,
            transparent 36% 45%,
            rgba(10,10,10,.92) 46% 51%,
            transparent 52% 62%,
            rgba(18,17,16,.82) 63% 68%,
            transparent 69% 79%,
            rgba(12,12,11,.76) 80% 85%,
            transparent 86%
        );
    transform:rotate(-.15deg) skewX(-1deg);
    filter:blur(.12px);
    mix-blend-mode:multiply
}

.scribble svg{
    width:100%;
    height:100%;
    overflow:visible
}

.scribble path{
    fill:none;
    stroke:#171717;
    stroke-width:3.2;
    stroke-linecap:round;
    opacity:.7
}

.scribble path.faint{
    stroke-width:2;
    opacity:.38
}

.scribble path.heavy{
    stroke-width:4.8;
    opacity:.82
}

/* =========================================================
   NOTE OBJECT
   ========================================================= */

.noteObj{
    width:330px;
    min-height:225px;
    padding:24px 24px 30px;
    background:
        linear-gradient(
            135deg,
            #f8edbb,
            #e9d994 62%,
            #cdb767
        );
    border:1px solid #a28b4d66;
    box-shadow:
        2px 9px 15px #0005,
        inset 0 0 25px #7b621c18;
    transform:rotate(-2deg);
    overflow:hidden
}

.noteObj:before{
    content:"";
    position:absolute;
    inset:0;
    background:
        repeating-linear-gradient(
            0deg,
            #6e541d0b 0 1px,

<script>

const $=s=>document.querySelector(s);

let turnBusy=false;
let draw=null;

/* =========================================================
   HELPERS
   ========================================================= */

function rnd(a,b){
    return Math.floor(Math.random()*(b-a+1))+a
}

function today(){
    const d=new Date();
    return String(d.getDate()).padStart(2,'0')+'.'+
           String(d.getMonth()+1).padStart(2,'0')+'.'+
           d.getFullYear()

function toast(t){
    const x=$('#toast');
    x.textContent=t;
    x.classList.add('show');
    clearTimeout(toast.t);
    toast.t=setTimeout(

    )
}

function rings(){

    const r=$('#rings');

    for(let i=0;i<19;i++){

/* =========================================================

    if(cover){

                    </div>

                        ></div>
                    </div>

                            class="value"

                        ></div>
                    </div>

                        ></div>
                    </div>

            </div>
        `;
    }

    return `

}

/* =========================================================
   CREATE SHEET
   ========================================================= */

function makeSheet(index,title='',cover=false){

    const s=document.createElement('div');

    s.className='page-sheet';
    s.dataset.i=index;

    const front=document.createElement('div');

    front.className='face front'+
        (cover?' coverPage':'');

    front.innerHTML=
        faceMarkup(
            true,
            index,
            title,
            cover
        );

    const back=document.createElement('div');

    back.className='face back';

    back.innerHTML=
        '<div class="backmark">SCP FOUNDATION — PERSONNEL NOTES</div>';

    s.append(front,back);

    $('#pages').appendChild(s);

    pages.push(s);

    bindPage(s);

    return s;
}

/* =========================================================
   PAGE EVENTS
   ========================================================= */

function bindPage(p){

    p.querySelectorAll('[contenteditable]').forEach(e=>{

        e.addEventListener(
            'input',
            ()=>{
                if(e.closest('.obj'))return
            }
        );

        e.addEventListener(
            'keydown',
            e=>{
                if(e.key==='Tab'){
                    e.preventDefault();
                    document.execCommand(
                        'insertText',
                        false,
                        '\t'
                    )
                }
            }
        );

    });

    p.addEventListener(
        'dragover',
        e=>e.preventDefault()
    );

    p.addEventListener(
        'drop',
        e=>{

            e.preventDefault();

            const a=
                e.dataTransfer.getData('asset');

            if(a){

                const r=
                    p.querySelector(
                        '.face.front'
                    ).getBoundingClientRect();

                addAsset(
                    a,
                    e.clientX-r.left,
                    e.clientY-r.top
                )
            }
        }
    );

    p.addEventListener(
        'click',
        ()=>{
            if(draw)stopDraw()
        }
    );
}

function init(){

    rings();

    $('#pages').innerHTML='';

    pages=[];

    makeSheet(
        0,
        '',
        true
    );

    makeSheet(
        1,
        'INITIAL NOTES'
    );

    for(let i=2;i<=8;i++){
        makeSheet(i,'')
    }

    updatePages();

    loadBook()
}

/* =========================================================
   PAGE UPDATE
   ========================================================= */

function updatePages(){

    pages.forEach((p,i)=>{

        p.classList.toggle(
            'flipped',
            i<current
        );

        p.classList.toggle(
            'active',
            i===current
        );

        p.classList.remove(
            'frontmost',
            'behind'
        );

        p.style.zIndex=
            i===current
                ?1000
                :(i<current
                    ?100+i
                    :10+i);
    });

    $('#pageLabel').textContent=
        current===0
            ?'COVER'
            :'PAGE '+current;
}

/* =========================================================
   PAGE TURNING
   ========================================================= */

function nextPage(){

    if(
        turnBusy||
        current>=pages.length-1
    )return;

    turnBusy=true;

    const p=pages[current];
    const under=pages[current+1];

    p.classList.add(
        'turning',
        'frontmost'
    );

    under.classList.add(
        'under-turn'
    );

    under.style.zIndex=8000;

    requestAnimationFrame(
        ()=>requestAnimationFrame(
            ()=>p.classList.add('flipped')
        )
    );

    setTimeout(
        ()=>{

            current++;

            p.classList.remove(
                'turning',
                'frontmost'
            );

            under.classList.remove(
                'under-turn'
            );

            updatePages();

            turnBusy=false;

            saveBook(false);

            toast(
                'PAGE '+current
            );

        },
        980
    )
}

function prevPage(){

    if(
        turnBusy||
        current<=0
    )return;

    turnBusy=true;

    const target=pages[current-1];
    const top=pages[current];

    top.style.zIndex=8000;
    target.style.zIndex=9000;

    target.classList.add(
        'turning',
        'frontmost'
    );

    requestAnimationFrame(
        ()=>requestAnimationFrame(
            ()=>target.classList.remove('flipped')
        )
    );

    setTimeout(
        ()=>{

            current--;

            target.classList.remove(
                'turning',
                'frontmost'
            );

            updatePages();

            turnBusy=false;

            saveBook(false);

            toast(
                'PAGE '+current
            );

        },
        980
    )
}

function newPage(){

    makeSheet(
        pages.length,
        ''
    );

    current=pages.length-1;

    updatePages();

    toast(
        'NEW PAGE '+current
    );

    saveBook(false)
}

function pageFront(){
    return pages[current]?.querySelector('.front')
}

/* =========================================================
   OBJECT SYSTEM
   ========================================================= */

function objBase(
    cls,
    w,
    h,
    x=230,
    y=220
){

    const o=document.createElement('div');

    o.className='obj '+cls;

    o.style.width=w+'px';
    o.style.height=h+'px';

    o.style.left=x+'px';
    o.style.top=y+'px';

    o.style.transform=
        'rotate('+rnd(-8,8)+'deg)';

    pageFront().appendChild(o);

    interactive(o);

    selectObj(o);

    return o;
}

function addHandles(o){

    ['tl','tr','bl','br'].forEach(c=>{

        const h=
            document.createElement('i');

        h.className=
            'handle '+c;

        o.appendChild(h)
    });

    const line=
        document.createElement('i');

    line.className='rotline';

    o.appendChild(line);

    const rot=
        document.createElement('i');

    rot.className='rot';

    o.appendChild(rot)
}

function selectObj(o){

    if(
        selected&&
        selected!==o
    ){
        selected.classList.remove(
            'selected'
        )
    }

    selected=o;

    o?.classList.add('selected')
}

function interactive(o){

    o.addEventListener(
        'pointerdown',
        startInteraction
    );

    o.addEventListener(
        'dblclick',
        ()=>o.querySelector(
            '[contenteditable]'
        )?.focus()
    )
}

function startInteraction(e){

    const o=e.currentTarget;

    if(
        e.target.closest('[contenteditable]')&&
        !e.target.classList.contains('textbox')
    )return;

    e.stopPropagation();

    selectObj(o);

    const r=
        o.getBoundingClientRect();

    if(
        e.target.classList.contains(
            'handle'
        )
    ){

        interaction={
            type:'resize',
            o,
            sx:e.clientX,
            sy:e.clientY,
            w:o.offsetWidth,
            h:o.offsetHeight,
            ratio:
                o.offsetHeight/
                o.offsetWidth
        };

    }else if(
        e.target.classList.contains('rot')
    ){

        interaction={
            type:'rotate',
            o,
            cx:r.left+r.width/2,
            cy:r.top+r.height/2
        };

    }else{

        interaction={
            type:'move',
            o,
            sx:e.clientX,
            sy:e.clientY,
            l:parseFloat(o.style.left),
            t:parseFloat(o.style.top)
        };
    }

    o.setPointerCapture?.(
        e.pointerId
    )
}

document.addEventListener(
    'pointermove',
    e=>{

        if(!interaction)return;

        const i=interaction;
        const o=i.o;

        if(i.type==='move'){

            o.style.left=
                (
                    i.l+
                    e.clientX-
                    i.sx
                )+'px';

            o.style.top=
                (
                    i.t+
                    e.clientY-
                    i.sy
                )+'px';

        }else if(i.type==='resize'){

            const dx=
                e.clientX-i.sx;

            const dy=
                e.clientY-i.sy;

            const d=
                Math.abs(dx)>
                Math.abs(dy)
                    ?dx
                    :dy;

            o.style.width=
                Math.max(
                    35,
                    i.w+d
                )+'px';

            o.style.height=
                Math.max(
                    35,
                    i.h+d*i.ratio
                )+'px';

        }else{

            const a=
                Math.atan2(
                    e.clientY-i.cy,
                    e.clientX-i.cx
                )*180/Math.PI;

            o.style.transform=
                'rotate('+
                (a+90)+
                'deg)';
        }
    }
);

document.addEventListener(
    'pointerup',
    ()=>{
        if(
            interaction?.type==='move'&&
            interaction.o?.classList.contains(
                'clip'
            )
        ){

            const o=interaction.o;

            const pr=
                pageFront()
                .getBoundingClientRect();

            const r=
                o.getBoundingClientRect();

            if(
                Math.abs(
                    r.left-pr.left
                )<55
            ){

                o.style.left='-18px';

            }else if(
                Math.abs(
                    r.right-pr.right
                )<55
            ){

                o.style.left=
                    (
                        pageFront().clientWidth-
                        o.offsetWidth+
                        10
                    )+'px';
            }

            o.style.zIndex=140;
        }

        interaction=null
    }
);

document.addEventListener(
    'pointerdown',
    e=>{

        if(
            !e.target.closest('.obj')&&
            !e.target.closest('#assets')&&
            !e.target.closest('#topbar')&&
            !e.target.closest('#formatbar')
        ){

            selected?.classList.remove(
                'selected'
            );

            selected=null
        }
    }
);

/* =========================================================
   IMAGE OBJECTS

function imgObj(
    src,
    cls,
    w,
    h,
    x,
    y,
    alt='asset'
){

    const o=
        objBase(
            cls,
            w,
            h,
            x,
            y
        );

    const im=
        document.createElement('img');

    im.src=src;
    im.className='assetImg';
    im.alt=alt;
    im.draggable=false;

    o.appendChild(im);

    addHandles(o);

    im.onerror=()=>{

        if(cls.includes('clip')){

            o.innerHTML=
                '<div class="clipFallback"></div>';

            addHandles(o);

        }else if(cls.includes('tape')){

            o.innerHTML=
                '<div class="tapeFallback"></div>';

            addHandles(o);

        }else if(cls.includes('blood')){

            o.innerHTML=
                '<div class="bloodFallback"></div>';

            addHandles(o);

        }else{

            o.remove()
        }
    };

    return o
}

function addScribble(
    x=150,
    y=470
){

    const o=
        objBase(
            'scribble',
            230,
            150,
            x,
            y
        );

    const variants=[
        0,
        1,
        2,
        3
    ];

    const v=
        variants[
            rnd(
                0,
                variants.length-1
            )
        ];

    let s=
        '<svg viewBox="0 0 230 150">';

    const count=
        v===0
            ?5
            :v===1
                ?9
                :v===2
                    ?13
                    :7;

    for(
        let j=0;
        j<count;
        j++
    ){

        let y0=
            rnd(
                20,
                130
            );

        let d=
            'M '+
            rnd(8,35)+
            ' '+
            y0;

        for(
            let k=0;
            k<rnd(5,10);
            k++
        ){

            d+=
                ' C '+
                rnd(35,95)+' '+
                rnd(5,145)+' '+
                rnd(115,175)+' '+
                rnd(5,145)+' '+
                rnd(195,222)+' '+
                rnd(5,145);
        }

        const cls=
            j%5===0
                ?'heavy'
                :j%3===0
                    ?'faint'
                    :'';

        s+=
            '<path class="'+
            cls+
            '" d="'+
            d+
            '"/>';
    }

    s+='</svg>';

    o.innerHTML=s;

    return o
}

/* =========================================================
   ASSET DISPATCH
   ========================================================= */

function addAsset(
    a,
    x=260,
    y=260
){

    if(a==='blood')
        addBlood(x,y,'blood');

    else if(a==='blood2')
        addBlood(x,y,'blood2');

    else if(a==='tape')
        addTape(x,y);

    else if(a==='clip')
        addClip(x,y);

    else if(a==='note')
        addNote(x,y);

    else if(a==='coffee')
        addCoffee(x,y);

    else if(a==='highlight')
        addHighlight(x,y);

    else if(a==='cross')
        addCross(x,y);

    else if(a==='underline')
        addUnderline(x,y);

    else if(a==='circle')
        addCircle(x,y);

    else if(a==='arrow')
        addArrow(x,y);

    else if(a==='scribble')
        addScribble(x,y);

    else if(a==='stamp')
        addStamp(x,y)
}

$$('#assets [draggable=true]').forEach(
    b=>{

        b.addEventListener(
            'dragstart',
            e=>{
                e.dataTransfer.setData(
                    'asset',
                    b.dataset.a
                )
            }
        );

        b.addEventListener(
            'click',
            ()=>addAsset(
                b.dataset.a
            )
        );
    }
);

/* =========================================================
   TEXT FORMATTING
   ========================================================= */

function restoreSelection(){

    if(window.savedRange){

        const s=
            window.getSelection();

        s.removeAllRanges();

        try{
            s.addRange(
                window.savedRange
            )
        }catch(e){}
    }
}

document.addEventListener(
    'selectionchange',
    ()=>{

        const s=
            window.getSelection();

        if(
            s.rangeCount&&
            !s.isCollapsed
        ){

            const a=
                s.anchorNode?.parentElement;

            if(
                a?.closest(
                    '.writing,.textbox,.noteText,.value,.ntitle,.date'
                )
            ){

                window.savedRange=
                    s.getRangeAt(0)
                    .cloneRange();
            }
        }
    }
);

/* =========================================================
   TEXT COLOR FIX
   ========================================================= */

function isWhiteColor(value){

    if(!value)return false;

    const v=
        String(value)
        .trim()
        .toLowerCase();

    return [
        'white',
        '#fff',
        '#ffffff',
        'rgb(255, 255, 255)',
        'rgba(255, 255, 255, 1)'
    ].includes(v);
}

function normalizeNotebookText(){

    const roots=document.querySelectorAll(
        '.writing, .value, .ntitle, .date, .textbox, .noteText'
    );

    roots.forEach(root=>{

        /*
         * Default notebook text is always dark.
         */
        root.style.setProperty(
            'color',
            '#171717',
            'important'
        );

        root.style.setProperty(
            '-webkit-text-fill-color',
            '#171717',
            'important'
        );

        root.style.caretColor='#171717';

        /*
         * Repair previously saved white inline colors.
         * Other intentional colors remain untouched.
         */
        root.querySelectorAll('*').forEach(el=>{

            if(el.style){

                if(
                    isWhiteColor(
                        el.style.getPropertyValue('color')
                    )
                ){
                    el.style.setProperty(
                        'color',
                        '#171717',
                        'important'
                    );
                }

                if(
                    isWhiteColor(
                        el.style.getPropertyValue(
                            '-webkit-text-fill-color'
                        )
                    )
                ){
                    el.style.setProperty(
                        '-webkit-text-fill-color',
                        '#171717',
                        'important'
                    );
                }
            }

            /*
             * Also repair old <font color="white"> elements.
             */
            if(
                el.tagName==='FONT' &&
                isWhiteColor(
                    el.getAttribute('color')
                )
            ){
                el.setAttribute(
                    'color',
                    '#171717'
                );
            }
        });
    });
}

function format(
    cmd,
    val=null
){

    /*
     * Prevent the color picker from creating white
     * when the selected color is white.
     */
    if(cmd==='foreColor' && isWhiteColor(val)){
        val='#171717';
    }

    restoreSelection();

    document.execCommand(
        cmd,
        false,
        val
    );

    normalizeNotebookText();

    toast(
        cmd.toUpperCase()
    );

    saveBook(false);
}

function escapeHTML(t){

    return t.replace(
        /[&<>\"']/g,
        m=>({
            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            '\"':'&quot;',
            "'":'&#39;'
        }[m])
    )
}

function roughFormat(type){

    restoreSelection();

    const sel=
        window.getSelection();

    if(
        !sel.rangeCount||
        sel.isCollapsed
    ){

        toast(
            'TEXT AUSWÄHLEN'
        );

        return
    }

    const range=
        sel.getRangeAt(0);

    if(
        !range.toString().trim()
    )return;

    const span=
        document.createElement(
            'span'
        );

    span.className=
        type==='highlight'
            ?'rough-highlight'
            :type==='cross'
                ?'rough-cross'
                :'rough-underline';

    if(type==='highlight'){

        span.style.setProperty(
            '--mark',
            $('#highlightColor').value+'b8'
        )
    }

    span.appendChild(
        range.extractContents()
    );

    range.insertNode(span);

    sel.removeAllRanges();

    const nr=
        document.createRange();

    nr.selectNodeContents(span);

    sel.addRange(nr);

    window.savedRange=
        nr.cloneRange();

    normalizeNotebookText();

    toast(
        type==='highlight'
            ?'ROUGH HIGHLIGHT'
            :type==='cross'
                ?'BLACK SCRIBBLE CROSS-OUT'
                :'HAND UNDERLINE'
    );

    saveBook(false);
}

function highlightText(){
    roughFormat('highlight')
}

function setHighlightColor(c){

    restoreSelection();

    document.execCommand(
        'hiliteColor',
        false,
        c
    );

    saveBook(false);
}

/* =========================================================
   DRAWING
   ========================================================= */

function drawMode(){

    if(draw){

        stopDraw();

        return
    }

    const f=pageFront();

    const c=
        document.createElement(
            'canvas'
        );

    c.className='drawLayer';

    c.width=f.clientWidth;
    c.height=f.clientHeight;

    c.style.cssText=
        'position:absolute;'+
        'inset:0;'+
        'width:100%;'+
        'height:100%;'+
        'z-index:35;'+
        'touch-action:none;'+
        'cursor:crosshair';

    f.appendChild(c);

    const ctx=
        c.getContext('2d');

    ctx.lineWidth=2.6;
    ctx.lineCap='round';
    ctx.strokeStyle='#171717';

    let drawing=false;

    const pos=e=>{

        const r=
            c.getBoundingClientRect();

        return{
            x:e.clientX-r.left,
            y:e.clientY-r.top
        }
    };

    c.onpointerdown=e=>{

        drawing=true;

        const p=pos(e);

        ctx.beginPath();

        ctx.moveTo(
            p.x,
            p.y
        );

        c.setPointerCapture(
            e.pointerId
        )
    };

    c.onpointermove=e=>{

        if(!drawing)return;

        const p=pos(e);

        ctx.lineTo(
            p.x,
            p.y
        );

        ctx.stroke()
    };

    c.onpointerup=
        ()=>drawing=false;

    c.onpointercancel=
        ()=>drawing=false;

    draw=c;

    toast(
        'DRAW MODE — click PEN again to finish'
    )
}

function stopDraw(){

    if(!draw)return;

    draw=null;

    toast(
        'DRAW SAVED'
    )
}

        const f=

            addPolaroid(
                r.result

        e.target.value=''
    }
);

            '</div>'+
            '<div class="date-stamp">ARCHIVE</div>'+
        '</div>';

    addHandles(o);

    toast(
        '2000s POLAROID'
    )
}

/* =========================================================
   SAVE / LOAD
   ========================================================= */

function cleanHTML(p){

    const c=
        p.cloneNode(true);

    c.querySelectorAll(
        '.selected'
    ).forEach(
        x=>x.classList.remove(
            'selected'
        )
    );

    c.querySelectorAll(
        '.handle,.rot,.rotline'
    ).forEach(
        x=>x.remove()
    );

    c.classList.remove(
        'active',
        'turning'
    );

    return c.outerHTML
}

function saveBook(show=true){

    try{

        /*
         * Normalize before saving so that old white text
         * cannot be saved again.
         */
        normalizeNotebookText();

        localStorage.setItem(
            'scpNotebookV8',
            JSON.stringify({
                current,
                pages:
                    pages.map(cleanHTML)
            })
        );

        if(show)
            toast('SAVED');

    }catch(e){

        console.warn(e);

        toast(
            'SAVE FAILED'
        )
    }
}

function loadBook(){

    const s=
        localStorage.getItem(
            'scpNotebookV8'
        );

    if(!s){

        /*
         * Even without saved data, make sure the
         * freshly generated pages are dark.
         */
        normalizeNotebookText();

        return;
    }

    try{

        const d=
            JSON.parse(s);

        if(
            !d||
            !Array.isArray(d.pages)||
            !d.pages.length
        ){

            normalizeNotebookText();

            return;
        }

        $('#pages').innerHTML=
            d.pages.join('');

        pages=[
            ...$('#pages').children
        ];

        current=
            Math.min(
                Number.isFinite(d.current)
                    ?d.current
                    :0,
                pages.length-1
            );

        pages.forEach(
            bindPage
        );

        pages.forEach(
            p=>
                p.querySelectorAll(
                    '.obj'
                ).forEach(
                    interactive
                )
        );

        /*
         * IMPORTANT:
         * Repair white text from older saved versions.
         */
        normalizeNotebookText();

        updatePages();

        /*
         * Save the repaired version immediately.
         */
        saveBook(false);

        toast(
            'LOADED'
        );

    }catch(e){

        console.warn(
            'Notebook konnte nicht geladen werden:',
            e
        );

        normalizeNotebookText();
    }
}

/* =========================================================
   RESET
   ========================================================= */

function resetBook(){

    if(
        !confirm(
            'Notebook wirklich zurücksetzen?'
        )
    )return;

    localStorage.removeItem(
        'scpNotebookV8'
    );

    init();

    toast(
        'RESET'
    )
}

/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    'keydown',
    e=>{

        if(
            e.key==='Delete'&&
            selected
        ){

            selected.remove();

            selected=null;

            saveBook(false);

            return
        }

        if(e.key==='Escape'){

            selected?.classList.remove(
                'selected'
            );

            selected=null;

            if(draw)
                stopDraw();

            return
        }

        if(
            (e.ctrlKey||e.metaKey)&&
            e.key.toLowerCase()==='s'
        ){

            e.preventDefault();

            saveBook();

            return
        }

        if(
            (e.ctrlKey||e.metaKey)&&
            e.key.toLowerCase()==='d'&&
            selected
        ){

            e.preventDefault();

            const n=
                selected.cloneNode(true);

            n.querySelectorAll(
                '.handle,.rot,.rotline'
            ).forEach(
                x=>x.remove()
            );

            addHandles(n);

            n.style.left=
                (
                    parseFloat(
                        selected.style.left
                    )+20
                )+'px';

            n.style.top=
                (
                    parseFloat(
                        selected.style.top
                    )+20
                )+'px';

            pageFront().appendChild(n);

            interactive(n);

            selectObj(n);

            normalizeNotebookText();

            saveBook(false);

            return
        }

        if(!typing()){

            if(
                e.key==='ArrowRight'
            )
                nextPage();

            if(
                e.key==='ArrowLeft'
            )
                prevPage();
        }
    }
);

/* =========================================================
   TYPING CHECK
   ========================================================= */

function typing(){

    const a=
        document.activeElement;

    return !!(
        a&&(
            a.isContentEditable||
            a.tagName==='INPUT'||
            a.tagName==='TEXTAREA'||
            a.tagName==='SELECT'
        )
    )
}

/* =========================================================
   START
   ========================================================= */

init();

</script>
