'https://pngimg.com/d/Paper_clip_PNG30.png',
'https://pngimg.com/uploads/paper_clip/paper_clip_PNG5.png',
'https://pngimg.com/d/Paper_clip_PNG17.png'
];
let pages=[],current=0,selected=null,interaction=null,turnBusy=false,draw=null;
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function today(){const d=new Date();return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear()}
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove('show'),1200)}
function rings(){const r=$('#rings');r.innerHTML='';for(let i=0;i<19;i++){const x=document.createElement('i');x.className='ring';x.style.top=(i*5.25)+'%';r.appendChild(x)}}
function faceMarkup(front,index,title='',cover=false){
    if(cover)return `<div class="content title"><img class="logo" src="${LOGO}"><div class="ft">SCP FOUNDATION</div><div class="sub">PERSONAL NOTEBOOK</div><div class="meta"><div class="row"><div class="label">NAME</div><div class="value coverField" contenteditable="true" spellcheck="false"></div></div><div class="row"><div class="label">DESIGNATION</div><div class="value coverField" contenteditable="true" spellcheck="false"></div></div><div class="row"><div class="label">ID-NUMBER</div><div class="value coverField" contenteditable="true" spellcheck="false"></div></div><div class="row"><div class="label">CLEARANCE</div><div class="value coverField" contenteditable="true" spellcheck="false"></div></div></div></div><div class="pno">COVER</div>`;
    return `<div class="margin-line"></div><div class="content note"><div class="head"><div class="ntitle" contenteditable="true">${title}</div><div class="date" contenteditable="true">${today()}</div></div><div class="writing" contenteditable="true" spellcheck="false"></div></div><div class="pno">${index}</div><div class="curl"></div>`;
}
function makeSheet(index,title='',cover=false){
    const s=document.createElement('div');s.className='page-sheet';s.dataset.i=index;
    const front=document.createElement('div');front.className='face front'+(cover?' coverPage':'');front.innerHTML=faceMarkup(true,index,title,cover);
    const back=document.createElement('div');back.className='face back';back.innerHTML='<div class="backmark">SCP FOUNDATION — PERSONNEL NOTES</div>';
    s.append(front,back);$('#pages').appendChild(s);pages.push(s);bindPage(s);return s;
}
function bindPage(p){p.querySelectorAll('[contenteditable]').forEach(e=>{const alwaysEditable=e.matches('.writing,.textbox,.noteText,.coverField,.ntitle,.date,.value');e.contentEditable=(isAdmin||alwaysEditable)?'true':'false';e.style.pointerEvents=(isAdmin||alwaysEditable)?'auto':'none';e.style.userSelect=(isAdmin||alwaysEditable)?'text':'none';e.addEventListener('input',()=>{if(isAdmin)scheduleCloudSave();else saveLocalOnly()});e.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();document.execCommand('insertText',false,'\t')}})});p.addEventListener('dragover',e=>e.preventDefault());p.addEventListener('drop',e=>{e.preventDefault();const a=e.dataTransfer.getData('asset');if(a){const r=p.querySelector('.face.front').getBoundingClientRect();addAsset(a,e.clientX-r.left,e.clientY-r.top)}});p.addEventListener('click',()=>{if(draw)stopDraw()})}
function init(){rings();$('#pages').innerHTML='';pages=[];makeSheet(0,'',true);makeSheet(1,'INITIAL NOTES');for(let i=2;i<=8;i++)makeSheet(i,'');updatePages();loadBook();subscribeRealtime();initAuth()}
function updatePages(){pages.forEach((p,i)=>{p.classList.toggle('flipped',i<current);p.classList.toggle('active',i===current);p.classList.remove('frontmost','behind');p.style.zIndex=i===current?1000:(i<current?100+i:10+i)});$('#pageLabel').textContent=current===0?'COVER':'PAGE '+current}
function nextPage(){if(turnBusy||current>=pages.length-1)return;turnBusy=true;const p=pages[current],under=pages[current+1];p.classList.add('turning','frontmost');under.classList.add('under-turn');under.style.zIndex=8000;requestAnimationFrame(()=>requestAnimationFrame(()=>p.classList.add('flipped')));setTimeout(()=>{current++;p.classList.remove('turning','frontmost');under.classList.remove('under-turn');updatePages();turnBusy=false;saveBook(false);toast('PAGE '+current)},980)}
function prevPage(){if(turnBusy||current<=0)return;turnBusy=true;const target=pages[current-1],top=pages[current];top.style.zIndex=8000;target.style.zIndex=9000;target.classList.add('turning','frontmost');requestAnimationFrame(()=>requestAnimationFrame(()=>target.classList.remove('flipped')));setTimeout(()=>{current--;target.classList.remove('turning','frontmost');updatePages();turnBusy=false;saveBook(false);toast('PAGE '+current)},980)}
function newPage(){if(!isAdmin){toast('READ ONLY');return}makeSheet(pages.length,'');current=pages.length-1;updatePages();toast('NEW PAGE '+current);scheduleCloudSave()}
function pageFront(){return pages[current]?.querySelector('.front')}
function objBase(cls,w,h,x=230,y=220){if(!isAdmin){toast('READ ONLY');return document.createElement('div')}
const o=document.createElement('div');o.className='obj '+cls;o.style.width=w+'px';o.style.height=h+'px';o.style.left=x+'px';o.style.top=y+'px';o.style.transform='rotate('+rnd(-8,8)+'deg)';pageFront().appendChild(o);interactive(o);selectObj(o);scheduleCloudSave();return o}
function addHandles(o){['tl','tr','bl','br'].forEach(c=>{const h=document.createElement('i');h.className='handle '+c;o.appendChild(h)});const line=document.createElement('i');line.className='rotline';o.appendChild(line);const rot=document.createElement('i');rot.className='rot';o.appendChild(rot)}
function selectObj(o){if(selected&&selected!==o)selected.classList.remove('selected');selected=o;o?.classList.add('selected')}
function interactive(o){o.addEventListener('pointerdown',startInteraction);o.addEventListener('dblclick',()=>o.querySelector('[contenteditable]')?.focus())}
function startInteraction(e){if(!isAdmin)return;const o=e.currentTarget;if(e.target.closest('[contenteditable]')&&!e.target.classList.contains('textbox'))return;e.stopPropagation();selectObj(o);const r=o.getBoundingClientRect();if(e.target.classList.contains('handle')){interaction={type:'resize',o,sx:e.clientX,sy:e.clientY,w:o.offsetWidth,h:o.offsetHeight,ratio:o.offsetHeight/o.offsetWidth}}else if(e.target.classList.contains('rot')){interaction={type:'rotate',o,cx:r.left+r.width/2,cy:r.top+r.height/2}}else{interaction={type:'move',o,sx:e.clientX,sy:e.clientY,l:parseFloat(o.style.left),t:parseFloat(o.style.top)}}o.setPointerCapture?.(e.pointerId)}
document.addEventListener('pointermove',e=>{if(!interaction)return;const i=interaction,o=i.o;if(i.type==='move'){o.style.left=(i.l+e.clientX-i.sx)+'px';o.style.top=(i.t+e.clientY-i.sy)+'px'}else if(i.type==='resize'){const dx=e.clientX-i.sx,dy=e.clientY-i.sy;const d=Math.abs(dx)>Math.abs(dy)?dx:dy;o.style.width=Math.max(35,i.w+d)+'px';o.style.height=Math.max(35,i.h+d*i.ratio)+'px'}else{const a=Math.atan2(e.clientY-i.cy,e.clientX-i.cx)*180/Math.PI;o.style.transform='rotate('+(a+90)+'deg)'}});document.addEventListener('pointerup',()=>{if(interaction?.type==='move'&&interaction.o?.classList.contains('clip')){const o=interaction.o,pr=pageFront().getBoundingClientRect(),r=o.getBoundingClientRect();if(Math.abs(r.left-pr.left)<55)o.style.left='-18px';else if(Math.abs(r.right-pr.right)<55)o.style.left=(pageFront().clientWidth-o.offsetWidth+10)+'px';o.style.zIndex=140;}interaction=null;scheduleCloudSave()});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.obj')&&!e.target.closest('#assets')&&!e.target.closest('#topbar')&&!e.target.closest('#formatbar')){selected?.classList.remove('selected');selected=null}});
function imgObj(src,cls,w,h,x,y,alt='asset'){const o=objBase(cls,w,h,x,y);const im=document.createElement('img');im.src=src;im.className='assetImg';im.alt=alt;im.draggable=false;o.appendChild(im);addHandles(o);im.onerror=()=>{if(cls.includes('clip')){o.innerHTML='<div class=\"clipFallback\"></div>';addHandles(o)}else if(cls.includes('tape')){o.innerHTML='<div class=\"tapeFallback\"></div>';addHandles(o)}else if(cls.includes('blood')){o.innerHTML='<div class=\"bloodFallback\"></div>';addHandles(o)}else{o.remove()}};return o}
function addBlood(x=240,y=240,kind='blood'){const src=BLOOD[rnd(0,BLOOD.length-1)];return imgObj(src,kind==='blood2'?'blood blood2':'blood',rnd(210,390),rnd(120,270),x,y,'blood')}
function addTape(x=220,y=220){const src=TAPE[rnd(0,TAPE.length-1)];return imgObj(src,'tape',rnd(180,330),rnd(52,95),x,y,'adhesive tape strip')}
function addClip(x=410,y=150){const src=CLIPS[rnd(0,CLIPS.length-1)];return imgObj(src,'clip',rnd(55,100),rnd(75,125),x,y,'paper clip')}
function addNote(x=220,y=270){const o=objBase('noteObj',310,210,x,y);o.style.transform='rotate('+rnd(-4,4)+'deg)';o.innerHTML='<div class="noteHead">PERSONAL NOTE</div><div class="noteText" contenteditable="true">Write a note...</div>';addHandles(o);return o}
function addCoffee(x=300,y=360){const o=objBase('stain',210,170,x,y);o.style.transform='rotate('+rnd(-12,12)+'deg)';return o}
function addHighlight(x=250,y=280){const o=objBase('textbox',240,45,x,y);o.innerHTML='<span class="highlightBlock" contenteditable="true">highlight this</span>';addHandles(o);return o}
function addCross(x=250,y=330){const o=objBase('textbox',230,45,x,y);o.innerHTML='<span class="crossout" contenteditable="true">crossed out</span>';addHandles(o);return o}
function addUnderline(x=250,y=380){const o=objBase('textbox',230,45,x,y);o.innerHTML='<span class="underline" contenteditable="true">underlined text</span>';addHandles(o);return o}
function addCircle(x=260,y=300){const o=objBase('circleMark',160,100,x,y);addHandles(o);return o}
function addArrow(x=330,y=310){const o=objBase('arrow',170,85,x,y);o.innerHTML='<svg viewBox="0 0 170 85"><path d="M10 67 C52 19 101 20 151 23" fill="none" stroke="#29251f" stroke-width="4" stroke-linecap="round"/><path d="M132 10 L154 23 L136 39" fill="none" stroke="#29251f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';addHandles(o);return o}
function addScribble(x=150,y=470){const o=objBase('scribble',230,150,x,y);const variants=[0,1,2,3];const v=variants[rnd(0,variants.length-1)];let s='<svg viewBox=\"0 0 230 150\">';const count=v===0?5:v===1?9:v===2?13:7;for(let j=0;j<count;j++){let y0=rnd(20,130),d='M '+rnd(8,35)+' '+y0;for(let k=0;k<rnd(5,10);k++)d+=' C '+rnd(35,95)+' '+rnd(5,145)+' '+rnd(115,175)+' '+rnd(5,145)+' '+rnd(195,222)+' '+rnd(5,145);const cls=j%5===0?'heavy':j%3===0?'faint':'';s+='<path class=\"'+cls+'\" d=\"'+d+'\"/>'}s+='</svg>';o.innerHTML=s;return o}
function addStamp(x=350,y=470){const o=objBase('',175,70,x,y);o.innerHTML='<div class="stamp">CLASSIFIED</div>';addHandles(o);return o}
function addSmiley(){const o=objBase('smiley',80,65,rnd(100,450),rnd(150,650));o.innerHTML=':)';addHandles(o);return o}
function addTextBox(){const o=objBase('textbox',270,75,150,220);o.innerHTML='<div class="textbox" contenteditable="true">Write something...</div>';addHandles(o);o.querySelector('[contenteditable]').focus();return o}
function addAsset(a,x=260,y=260){if(!isAdmin){toast('READ ONLY');return}if(a==='blood')addBlood(x,y,'blood');else if(a==='blood2')addBlood(x,y,'blood2');else if(a==='tape')addTape(x,y);else if(a==='clip')addClip(x,y);else if(a==='note')addNote(x,y);else if(a==='coffee')addCoffee(x,y);else if(a==='highlight')addHighlight(x,y);else if(a==='cross')addCross(x,y);else if(a==='underline')addUnderline(x,y);else if(a==='circle')addCircle(x,y);else if(a==='arrow')addArrow(x,y);else if(a==='scribble')addScribble(x,y);else if(a==='stamp')addStamp(x,y)}
$$('#assets [draggable=true]').forEach(b=>{b.addEventListener('dragstart',e=>e.dataTransfer.setData('asset',b.dataset.a));b.addEventListener('click',()=>addAsset(b.dataset.a));});
/* text formatting */
function restoreSelection(){if(window.savedRange){const s=window.getSelection();s.removeAllRanges();s.addRange(window.savedRange)}}
document.addEventListener('selectionchange',()=>{const s=window.getSelection();if(s.rangeCount&&!s.isCollapsed){const a=s.anchorNode?.parentElement;if(a?.closest('.writing,.textbox,.noteText,.value,.ntitle,.date'))window.savedRange=s.getRangeAt(0).cloneRange()}});
function format(cmd,val=null){if(!isAdmin){toast('READ ONLY');return}restoreSelection();document.execCommand(cmd,false,val);toast(cmd.toUpperCase())}
function escapeHTML(t){return t.replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
function roughFormat(type){if(!isAdmin){toast('READ ONLY');return}restoreSelection();const sel=window.getSelection();if(!sel.rangeCount||sel.isCollapsed){toast('TEXT AUSWÄHLEN');return}const range=sel.getRangeAt(0);if(!range.toString().trim())return;const span=document.createElement('span');span.className=type==='highlight'?'rough-highlight':type==='cross'?'rough-cross':'rough-underline';if(type==='highlight')span.style.setProperty('--mark',$('#highlightColor').value+'b8');span.appendChild(range.extractContents());range.insertNode(span);sel.removeAllRanges();const nr=document.createRange();nr.selectNodeContents(span);sel.addRange(nr);window.savedRange=nr.cloneRange();toast(type==='highlight'?'ROUGH HIGHLIGHT':type==='cross'?'BLACK SCRIBBLE CROSS-OUT':'HAND UNDERLINE')}
function highlightText(){roughFormat('highlight')}
function setHighlightColor(c){if(!isAdmin){toast('READ ONLY');return}restoreSelection();document.execCommand('hiliteColor',false,c);}
/* drawing layer */
function drawMode(){if(!isAdmin){toast('READ ONLY');return}if(draw){stopDraw();return}const f=pageFront();const c=document.createElement('canvas');c.className='drawLayer';c.width=f.clientWidth;c.height=f.clientHeight;c.style.cssText='position:absolute;inset:0;width:100%;height:100%;z-index:35;touch-action:none;cursor:crosshair';f.appendChild(c);const ctx=c.getContext('2d');ctx.lineWidth=2.6;ctx.lineCap='round';ctx.strokeStyle='#171717';let drawing=false;const pos=e=>{const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};c.onpointerdown=e=>{drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()};c.onpointerup=()=>drawing=false;c.onpointercancel=()=>drawing=false;draw=c;toast('DRAW MODE — click PEN again to finish')}
function stopDraw(){if(!draw)return;draw=null;toast('DRAW SAVED')}
/* photo */
function pickImage(){if(!isAdmin){toast('READ ONLY');return}$('#imageInput').click()}
$('#imageInput').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>addImage(r.result);r.readAsDataURL(f);e.target.value=''})
function addImage(src){if(!isAdmin||!src)return;const test=new Image();test.onload=()=>{const maxW=360,maxH=300,ratio=Math.min(1,maxW/test.naturalWidth,maxH/test.naturalHeight),w=Math.max(40,Math.round(test.naturalWidth*ratio)),h=Math.max(40,Math.round(test.naturalHeight*ratio)),f=pageFront(),o=objBase('customImage',w,h,Math.max(20,(f.clientWidth-w)/2),Math.max(60,(f.clientHeight-h)/2));o.style.transform='rotate(0deg)';o.style.background='transparent';const im=document.createElement('img');im.src=src;im.className='assetImg';im.draggable=false;im.style.background='transparent';o.appendChild(im);addHandles(o);scheduleCloudSave();toast('IMAGE INSERTED — ORIGINAL')};test.onerror=()=>toast('IMAGE FAILED');test.src=src}
document.addEventListener('paste',e=>{if(!isAdmin)return;const item=[...(e.clipboardData?.items||[])].find(x=>x.kind==='file'&&x.type.startsWith('image/'));if(!item)return;const f=item.getAsFile();if(!f)return;e.preventDefault();const r=new FileReader();r.onload=()=>addImage(r.result);r.readAsDataURL(f);toast('IMAGE PASTED — ORIGINAL')},true);
function pickPhoto(){if(!isAdmin){toast('READ ONLY');return}$('#photoInput').click()}$('#photoInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>addPolaroid(r.result);r.readAsDataURL(f);e.target.value=''})
function addPolaroid(src){const o=objBase('',300,350,rnd(90,410),rnd(130,500));o.innerHTML='<div class="polaroid"><div class="tape-corner"></div><img class="photo" src="'+src+'"><div class="film"></div><div class="grain"></div><div class="age"></div><div class="wear"></div><div class="caption" contenteditable="true">'+rnd(2001,2008)+' / '+String(rnd(1,12)).padStart(2,'0')+' / S-416</div><div class="date-stamp">ARCHIVE</div></div>';addHandles(o);toast('2000s POLAROID')}
/* persistence: clone without selection UI + Supabase cloud storage */
function cleanHTML(p){const c=p.cloneNode(true);c.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));c.querySelectorAll('.handle,.rot,.rotline').forEach(x=>x.remove());c.classList.remove('active','turning');return c.outerHTML}

function defaultState(){
    const holder=document.createElement('div');
    holder.innerHTML='';
    return {current:0,pages:pages.map(cleanHTML)};
}

function applyState(d,notice=false){
    if(!d||!Array.isArray(d.pages)||!d.pages.length)return;
    remoteApplying=true;
    $('#pages').innerHTML=d.pages.join('');
    pages=[...$('#pages').children];
    current=Math.min(Math.max(Number.isFinite(Number(d.current_page))?Number(d.current_page):0,0),pages.length-1);
    pages.forEach(bindPage);
    pages.forEach(p=>p.querySelectorAll('.obj').forEach(interactive));
    updatePages();
    remoteApplying=false;
    if(notice)toast('SYNCED FROM SERVER');
}

function saveLocalOnly(){
    try{
        localStorage.setItem('scpNotebookLocal',JSON.stringify({current,pages:pages.map(cleanHTML)}));
    }catch(e){}
}

async function saveBook(show=true){
    if(!isAdmin){if(show)toast('READ ONLY');return false}
    if(remoteApplying)return false;
    const payload={pages:pages.map(cleanHTML),current_page:current,updated_at:new Date().toISOString()};
    const {error}=await db.from('notebook_state').update(payload).eq('id',1);
    if(error){console.error(error);if(show)toast('SAVE FAILED');return false}
    if(show)toast('SAVED TO SERVER');
    return true;
}

function scheduleCloudSave(){
    if(!isAdmin||remoteApplying)return;
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>saveBook(false),1200);
}

async function loadBook(){
    const {data,error}=await db.from('notebook_state').select('pages,current_page,updated_at').eq('id',1).maybeSingle();
    if(error){console.error('Supabase load error:',error);toast('SERVER LOAD FAILED');return}
    if(data&&Array.isArray(data.pages)&&data.pages.length){applyState(data);toast('LOADED FROM SERVER')}
}

function subscribeRealtime(){
    db.channel('notebook-live')
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'notebook_state',filter:'id=eq.1'},payload=>{
          if(isAdmin)return;
          applyState(payload.new,true);
      })
      .subscribe(status=>console.log('Notebook realtime:',status));
}

async function checkAdmin(s){
    if(!s){setEditorMode(false);return false}
    const email=s.user?.email||'';
    const {data,error}=await db.from('admin_users').select('email').eq('email',email).maybeSingle();
    if(error){
        console.warn('Admin check failed:',error);
        setEditorMode(false);
        return false;
    }
    return !!data;
}

function setEditorMode(admin){
    isAdmin=!!admin;
    document.body.classList.toggle('admin-mode',isAdmin);
    $$('[contenteditable]').forEach(e=>{const alwaysEditable=e.matches('.writing,.textbox,.noteText,.coverField,.ntitle,.date,.value');e.contentEditable=(isAdmin||alwaysEditable)?'true':'false';e.style.pointerEvents=(isAdmin||alwaysEditable)?'auto':'none';e.style.userSelect=(isAdmin||alwaysEditable)?'text':'none';});
    $('#authButton').textContent=isAdmin?'ADMIN / LOGOUT':'ADMIN LOGIN';
    $('#authStatus').textContent=isAdmin?'ADMIN MODE':'READ ONLY';
    if(!isAdmin&&draw)stopDraw();
    selected?.classList.remove('selected');
    selected=null;
}

async function updateAuthState(s){
    session=s||null;
    const admin=await checkAdmin(session);
    setEditorMode(admin);
    authReady=true;
}

function openAuth(){
    if(isAdmin){logoutAdmin();return}
    $('#authModal').classList.add('open');
    $('#authModal').setAttribute('aria-hidden','false');
    $('#authMessage').textContent='';
    setTimeout(()=>$('#authEmail').focus(),30);
}
function closeAuth(){
    $('#authModal').classList.remove('open');
    $('#authModal').setAttribute('aria-hidden','true');
}

async function loginAdmin(){
    const email=$('#authEmail').value.trim();
    const password=$('#authPassword').value;
    if(!email||!password){$('#authMessage').textContent='ENTER EMAIL AND PASSWORD.';return}
    $('#authMessage').textContent='AUTHENTICATING...';
    const {data,error}=await db.auth.signInWithPassword({email,password});
    if(error){console.error(error);$('#authMessage').textContent='LOGIN FAILED: '+error.message;return}
    const admin=await checkAdmin(data.session);
    if(!admin){await db.auth.signOut();setEditorMode(false);$('#authMessage').textContent='ACCESS DENIED — ACCOUNT IS NOT AN ADMIN.';return}
    session=data.session;setEditorMode(true);$('#authModal').classList.add('loggedIn');$('#authMessage').textContent='ACCESS GRANTED.';toast('ADMIN ACCESS GRANTED');setTimeout(closeAuth,500);
}

async function logoutAdmin(){
    await db.auth.signOut();
    session=null;setEditorMode(false);$('#authModal').classList.remove('loggedIn');toast('LOGGED OUT');
}

$('#authModal').addEventListener('click',e=>{if(e.target.id==='authModal')closeAuth()});

async function initAuth(){
    const {data}=await db.auth.getSession();
    await updateAuthState(data.session);
    db.auth.onAuthStateChange(async(_event,s)=>{
        if(_event==='SIGNED_IN'||_event==='SIGNED_OUT'||_event==='TOKEN_REFRESHED')await updateAuthState(s);
    });
}

/* keyboard */

document.addEventListener('keydown',e=>{if(e.key==='Delete'&&selected&&isAdmin){selected.remove();selected=null;scheduleCloudSave();return}if(e.key==='Escape'){selected?.classList.remove('selected');selected=null;if(draw)stopDraw();return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveBook();return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'&&selected&&isAdmin){e.preventDefault();const n=selected.cloneNode(true);n.querySelectorAll('.handle,.rot,.rotline').forEach(x=>x.remove());addHandles(n);n.style.left=(parseFloat(selected.style.left)+20)+'px';n.style.top=(parseFloat(selected.style.top)+20)+'px';pageFront().appendChild(n);interactive(n);selectObj(n);scheduleCloudSave();return}if(!typing()){if(e.key==='ArrowRight')nextPage();if(e.key==='ArrowLeft')prevPage()}});
function typing(){const a=document.activeElement;return !!(a&&(a.isContentEditable||a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'))}
init();
</script>
</body></html>
